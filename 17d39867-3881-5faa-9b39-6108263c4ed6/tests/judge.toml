evaluation_rule = "EVIDENCE: the added lines beside the lines already in the same file. Judge against that file, never against a convention from elsewhere in the project or from your own taste. A file with no discernible convention cannot fail this criterion; answer unknown."

[[criterion]]
id = "Q4"
description = "dead code, a commented-out experiment or debug residue remains in the diff"
type = "binary"
weight = 1
negate = true
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "craft"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "the diff adds an unreachable branch, a commented-out block, a print, or a breakpoint"
evaluation_rule = "EVIDENCE: lines the diff adds. A print or breakpoint left behind, a block commented out rather than deleted, a helper defined and never called, or a branch no input can reach, all answer yes. Logging through the project's own logger is not debug residue. A deliberately unused argument required by an interface is not dead code."

