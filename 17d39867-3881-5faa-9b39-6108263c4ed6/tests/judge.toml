# GENERATED SECTION. DO NOT HAND-EDIT.
#
# Status: weighted.
# the delivered channel is the Reward Kit judge inside the verifier, weighted at 0.1 against
# the deterministic channel's 0.9 in tests/reward.toml, so it carries 10 percent of the
# reward. Its contribution is thresholded rather than averaged in continuously, because
# tests/judge.toml sets aggregation threshold at Reward Kit's default bar of 0.5, so the
# rubric becomes 1.0 or 0.0 before the mean. That is what lets the reference fix score exactly
# 1.0 and an empty submission exactly 0.0 while the channel still carries weight, measured
# over three consecutive oracle runs. A judge returns an opinion that moves run to run on
# identical bytes, observed between 0.7419 and 0.8065 on the reference fix and between 0.0323
# and 0.2903 on an empty diff, so a continuous contribution would put the reference
# permanently below 1.0 and make the reward irreproducible. solution/judge/compose.py keeps
# ALPHA at 0.05 for the author-side composition it performs outside Harbor, which is a
# different path and not the delivered one. It shipped at 0 while the rubric was uncalibrated,
# because weighting a rubric nobody has checked lets an unmeasured judge move real scores. The
# operator has run the agreement pass and confirmed the channel separates the classes the
# deterministic channel cannot see, which is what admits a non-zero weight. Harbor has no
# composition step and reads the reward key alone, task.toml carries no alpha, and the
# approved contract binds none, so the value is the author's to set and SCORE_ALPHA overrides
# it at run time.
#
# every criterion names one of the contract's bound step-7 obligations, a dimension from the
# bound six, and an evaluation_target from the bound three, so trinity/tools/judge_layout.py
# accepts it with no change to the approved contract.
#
# the reference bundles express a prohibition as a negative weight. Trinity item 9g forbids
# that and Harbor Reward Kit refuses it under weighted-mean aggregation, so a prohibition here
# carries a positive weight with negate true and the driver inverts it: passed = satisfied XOR
# negate.

# Reward Kit builds the judge's user message from the files named here. With none it
# sends a system message alone, the provider refuses the call, the invocation fails and
# no reward is written at all. tests/test.sh produces this diff before scoring. Per-
# criterion files are refused for an LLM judge (rewardkit reward.py), so the judge table
# is where they belong. The model stays at the Reward Kit default so the runner chooses
# it, and its credential arrives at invocation through harbor run --ve.
[judge]
judge = "openai/gpt-5.6-sol"
files = ["/logs/verifier/final.diff"]

# The judged component is thresholded rather than averaged in continuously. A judge score
# is an opinion that moves run to run on identical bytes, so a continuous contribution
# makes the reward irreproducible; the question of whether it cleared the bar is stable
# while the bar sits in the gap between a clean submission and a slopped one. Clearing it
# pays the judged channel in full, missing it pays nothing, so residue the deterministic
# channel cannot see still costs the solver its weight. The bar is Reward Kit's own
# default, left where the library puts it: the reference fix has been observed between
# 0.7419 and 0.8065, so the margin is wide, and no measurement here justifies moving it.
[scoring]
aggregation = "threshold"
threshold = 0.5

[[criterion]]
id = "R1"
description = "dvc status --cloud accepts a path to a dataset as its target, resolving that path rather than searching the directory tree beneath it"
type = "binary"
weight = 5
negate = false
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "coverage"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "the target is resolved as a dataset path, and a directory target no longer triggers a recursive search"
evaluation_rule = "EVIDENCE: the target-resolution code reached by status --cloud. The release calls the old directory-search behaviour a bug, so narrowing it is the required change rather than a regression. What FAILS is a change that special-cases the shapes of the graded test's fixtures: a branch keyed to a fixture name, a hardcoded dataset path, or a count that matches the test's case count. If the resolution cannot be followed without the test file open beside it, answer no."

[[criterion]]
id = "R2"
description = "dvc data status --not-in-remote accepts a --remote option naming the remote to check against, instead of only the default remote"
type = "binary"
weight = 5
negate = false
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "coverage"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "the option is declared on the command and threaded to the code that selects the remote"
evaluation_rule = "EVIDENCE: the argument parser for data status and the remote-selection call it feeds. The option must reach the selection, not merely parse. What FAILS is an option accepted and discarded, or one honoured only on the path the graded test happens to take."

[[criterion]]
id = "R3"
description = "exp show accepts --keep and --drop more than once and applies every occurrence"
type = "binary"
weight = 3
negate = false
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "coverage"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "both options accumulate rather than overwrite, and each accumulated pattern is applied"
evaluation_rule = "EVIDENCE: the option declarations and the filter that consumes them. Accumulating one of the two and overwriting the other FAILS. A single-occurrence implementation that the graded test passes by accident also FAILS."

[[criterion]]
id = "R4"
description = "dvc init initialises a repository in a directory given as an argument, not only in the current working directory"
type = "binary"
weight = 3
negate = false
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "coverage"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "the target directory is taken from the argument and used for every path the initialisation writes"
evaluation_rule = "EVIDENCE: the init entry point and the paths it derives. Changing the process working directory instead of deriving paths from the argument FAILS, because it leaves the rest of the command observing a directory the caller did not ask for."

[[criterion]]
id = "R5"
description = "checkout and pull report the summary of changes from the statistics the operation itself collected, rather than from a count recomputed for the report"
type = "binary"
weight = 3
negate = false
[criterion.annotations]
obligation = "RL-NO-REGRESSION"
dimension = "robustness"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "the reported figures derive from the operation's own collected statistics"
evaluation_rule = "EVIDENCE: where the summary numbers come from. Recomputing them by re-walking the tree after the fact FAILS: it can disagree with what the operation did and it is the shape that breaks when an operation is partially applied. Deriving them from the collected statistics SATISFIES this criterion."

[[criterion]]
id = "Q1"
description = "a comment, docstring or message in the diff asserts a behaviour the change does not implement"
type = "binary"
weight = 5
negate = true
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "craft"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "a quoted line claims behaviour that is absent from the same diff"
evaluation_rule = "EVIDENCE: comments, docstrings and user-facing strings added by the diff, read against the code in the same diff. Answer yes only by quoting a line whose claim the diff contradicts. A docstring that is merely terse, or a message that is imprecise but not false, is not a false claim. Missing a requirement is being wrong, and being wrong is not dishonesty."

[[criterion]]
id = "Q2"
description = "the diff carries refactoring, reordering or formatting churn unrelated to the specified behaviour"
type = "binary"
weight = 3
negate = true
[criterion.annotations]
obligation = "DM-IMPL"
dimension = "craft"
mode = "judged"
evidence = ["repository_working_tree"]
evaluation_target = "repository_working_tree"
judgment = "a hunk changes code whose behaviour the specification does not name"
evaluation_rule = "EVIDENCE: each hunk, classified as required by the specification or not. Renaming a local, extracting a helper, or reordering imports inside a function the change must touch anyway is not churn. Reformatting a file the behaviour does not require, or reordering unrelated declarations, is."

[[criterion]]
