# Harbor Reward Kit scoring config for this bundle.
#
# One [[reward]] table named `reward`, which is the key Harbor reads out of
# /logs/verifier/reward.json and the value the pilot grades on.
#
# Aggregation is weighted-mean because the delivery block binds reward_type = continuous.
# RB-OUTCOME-IMPL carries binary resolution, RB-COVERAGE-REQUIRED the continuous fix rate.
#
# The catastrophic red-line penalty does NOT come from the aggregation here: every criterion in
# test_output.py is gated on _gradable(), so a tripped red line zeroes each term and the mean is
# zero. Under all-pass the aggregation carried that, at the cost of discarding the fix rate.
#
# judge.toml ships in the verifier image beside this file, where forge/outputs.md item 34 and
# forge/phase-build.md item 10f require it. Reward Kit discovers it in the same invocation as
# the deterministic criteria, so both channels share one asyncio.TaskGroup: a credential the
# runner did not supply raises past litellm.Timeout, no except clause guards the group, and
# rewardkit writes no reward at all. The runner must therefore pass the judge credential at
# invocation: harbor run --ve 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}', or rewardkit --judge-env.

[[reward]]
name = "reward"
aggregation = "weighted-mean"
# Reward Kit discovers test_output and judge as two inputs and, left alone, takes an unweighted
# mean of them, which hands the judged channel half the score. The declared alpha is 0.05, so
# the judged channel carries 2*alpha = 10 percent and the deterministic channel the rest. These
# weights are what make the delivered composition match that declaration.
weights = { test_output = 0.9, judge = 0.1 }

# Programmatic scoring is keyed by Python filename stem, so this table governs test_output.py.
[scoring.test_output]
aggregation = "weighted-mean"
