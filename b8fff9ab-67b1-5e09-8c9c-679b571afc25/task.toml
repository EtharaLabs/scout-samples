[upstream_provenance]
origin = "original"
provenance_date = "2026-11-01"
source_kind = "public_repository"

[upstream_provenance.source]
canonical_repo = "https://github.com/sympy/sympy"
base_commit = "c870d17c2638f5061800e344b72ff80086a0b41d"
event_timestamp = "2025-04-27T11:39:45Z"

[span_provenance]
enumerated_objective_count = 14
pr_count = 0
pr_count_note = """
Pull request numbers, tags and diffs are withheld. The release prose is read by the author and
the objectives are restated positionally, because a tag, a pull request number or a diff is
each a retrieval handle to the published answer. Several of this release's tests are named for
the issue they close; those numbers appear in the test names the solver will see when the
suite runs, and nothing further is disclosed about them.
"""

[interface_spec]
bound = true
bound_note = """
Five test modules in this cluster cannot be IMPORTED at the base revision, because each
imports a name the release introduces. Until those names exist the modules contribute nothing
but a collection error, so the names are disclosed here: a task that withheld them would be
measuring whether a solver can guess an identifier, not whether it can implement behaviour.

The graded sets were then built so that merely creating the names earns nothing. A probe tree
restores collection using five deliberately non-functional stubs; every node that passes under
that probe is excluded, and zero of the 52 required nodes pass under it. Disclosing the names
therefore costs the task nothing, which is why it is safe to do.

Everything else must be derived from the repository and from what the tests assert. This
release's behavioural work is overwhelmingly in conduct behind interfaces the pinned revision
already exports, and only the seven entries below are new or changed surface.
"""

[[interface_spec.symbol]]
objective = "a base class for functions the library defines"
module = "sympy.core.function"
symbol = "DefinedFunction"
parameters = "class, subclass of Function"
returns = "the base class that library-defined functions derive from, separating them from user-defined ones. The core's class-registration test asserts it is constructible and registered, and the elementary and special function hierarchies are expected to sit under it."

[[interface_spec.symbol]]
objective = "a cache for integer factorisation"
module = "sympy.ntheory.factor_"
symbol = "FactorCache"
parameters = "class"
returns = "the cache type backing repeated factorisation. A module-level instance named `factor_cache` is also expected: the release's own test imports that exact lowercase name from this module, so both the class and the instance are part of the surface."

[[interface_spec.symbol]]
objective = "factoring by quadratic sieve"
module = "sympy.ntheory.qs"
symbol = "qs_factor"
parameters = "N, prime_bound, M, ERROR_TERM=25, seed=1234"
returns = "the factorisation of N as a mapping of prime to multiplicity, where the existing `qs` returns a set of factors. Note the five positional parameters and the two defaults. It must also be re-exported from the `sympy.ntheory` package namespace, because the test imports it from there rather than from this module."

[[interface_spec.symbol]]
objective = "factoring by quadratic sieve"
module = "sympy.ntheory.qs"
symbol = "_generate_polynomial"
parameters = "(private, imported by name)"
returns = "a private helper the release's own test module imports by exact name alongside the public entry points. It is disclosed for that reason only; its contract is whatever the tests that exercise it require."

[[interface_spec.symbol]]
objective = "printing C that targets the C math library"
module = "sympy.printing.pycode"
symbol = "CmathPrinter"
parameters = "class, a code printer"
returns = "a printer emitting expressions against the C math library's complex functions. It lives in the Python-code printing module rather than the C one, which is where the test imports it from."

[[interface_spec.symbol]]
objective = "printing for an array framework"
module = "sympy.printing.pytorch"
symbol = "TorchPrinter, torch_code"
parameters = "TorchPrinter is a class; torch_code(expr, requires_grad=False, dtype=None)"
returns = "a printer and a convenience entry point for a tensor framework, in a NEW module. The tests for this module are EXCLUDED from grading because the framework is not installed in this environment, so no required node depends on it; it is disclosed because the module is part of the release's surface and the package namespace references it."

[[interface_spec.symbol]]
objective = "substitution accepting an explicit pair"
module = "sympy.core.basic"
symbol = "Basic.subs"
parameters = "self, arg1, arg2=None, **kwargs"
returns = "the substituted expression. The signature CHANGES: the release names the first two arguments explicitly where the base revision took them from *args. Callers passing a single mapping, a single sequence of pairs, or two separate arguments must all keep working, which is what the core's substitution test checks."
